<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CMM System</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110d" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica tema e preferência de movimento ANTES do primeiro desenho (evita "piscar" claro/escuro).
      (function () {
        try {
          var theme = localStorage.getItem('theme_mode');
          var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          var motion = localStorage.getItem('motion_mode');
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.setAttribute('data-motion', motion ? motion : reduce ? 'off' : 'on');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="scroll-progress" aria-hidden="true"></div>
    <app-root></app-root>
    <noscript>Este sistema precisa de JavaScript para funcionar.</noscript>
  </body>
</html>
